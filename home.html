<!DOCTYPE html>
<html>

<head>
    <title>
        KD's Logbook
    </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <a href="/home"><img id="home-button" src="home.svg" width=50px height=50px></a>
            <h1 class="heading"> KD's Logbook</h1>
            <img src="/menu.svg" width=60px height=60px>
        </nav>
    </header>
    <main>
        <div class="categories">
            <div class="comics">
                <a href="/comics">
                    <img class="category-cover"
                        src="https://img.freepik.com/free-vector/comic-style-wallpaper_79603-1248.jpg" width=90%
                        height=80%>

                    <h1 class="category-heading">Comics</h1>
                </a>
            </div>
            <div class="movies">
                <a href="/comics">
                    <img class="category-cover"
                        src="https://media.istockphoto.com/id/1391013277/vector/realistic-film-stripe-wave-on-blue-background-with-place-for-text-modern-3d-isometric-film.jpg?s=612x612&w=0&k=20&c=HjOQAt6S-ZNh69WRF91LyBPEsVel3Ct0AawbPj8MQBM="
                        width=90% height=80%>
                    <h1 class="category-heading">Movies & Shows</h1>
                </a>
            </div>
            <div class="restaurants">
                <a href="/comics">
                    <img class="category-cover"
                        src="https://static8.depositphotos.com/1453997/963/v/450/depositphotos_9632573-stock-illustration-spanish-menu-template.jpg"
                        width=90% height=80%>
                    <h1 class="category-heading">Restaurants</h1>
                </a>
            </div>
            <div class="countries">
                <a href="/comics">
                    <img class="category-cover" src="https://images6.alphacoders.com/400/thumb-1920-400645.jpg" width=90%
                        height=80%>
                    <h1 class="category-heading">Countries</h1>
                </a>
            </div>
        </div>
    </main>
</body>

</html>
